name: Tägliches Daten-Update

on:
  schedule:
    # 3x täglich (UTC): ~06:00, ~12:00, ~17:00 deutscher Sommerzeit
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
    - cron: "0 15 * * *"
    - cron: "30 17 * * *"   # 19:30 Berlin: offizielle Aufstellungen der Abendspiele
  workflow_dispatch: {}   # manueller Start über den Actions-Tab
  push:
    branches: [main]      # läuft auch nach jedem Push (z.B. bei Code-Änderungen)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install --quiet openpyxl

      - name: Tennis-Historie laden (tennis-data.co.uk)
        run: |
          {
            mkdir -p /tmp/tennisdata
            Y=$(date +%Y)
            fetch_xlsx() {  # $1=Ziel, $2=Pfadteil (z.B. 2024 oder 2024w), $3=Jahr
              for base in "https://www.tennis-data.co.uk" "http://www.tennis-data.co.uk"; do
                code=$(curl -sL -w "%{http_code}" "${base}/$2/$3.xlsx" -o "$1") || code=err
                if [ "${code}" = "200" ] && file "$1" | grep -qiE 'excel|zip'; then
                  echo "$1: OK über ${base} ($(wc -c < "$1") Bytes)"
                  return 0
                fi
              done
              echo "$1: FEHLGESCHLAGEN (letzter Code ${code}); Antwort-Anfang:"
              head -c 300 "$1" 2>/dev/null | tr -d '\0'; echo
              rm -f "$1"
              return 1
            }
            for y in $((Y-4)) $((Y-3)) $((Y-2)) $((Y-1)) $Y; do
              fetch_xlsx "/tmp/tennisdata/atp_${y}.xlsx" "${y}" "${y}" || true
              fetch_xlsx "/tmp/tennisdata/wta_${y}.xlsx" "${y}w" "${y}" || true
            done
            ls -la /tmp/tennisdata/ || true
          } 2>&1 | tee /tmp/clone.log

      - name: Daten holen & Vorhersagen berechnen
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}       # optional (Gratis-Quoten)
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}       # optional (Tennis+Fussball via RapidAPI)
          TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}   # optional (nur Tennis)
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}  # optional (API-Football direkt)
        run: |
          set -o pipefail
          { cat /tmp/clone.log 2>/dev/null; python scripts/fetch_data.py; } 2>&1 | tee data/last_run.log

      - name: Dashboard bauen
        run: python scripts/build_site.py data/data.json index.html

      - name: Seite mit Passwort schützen (optional)
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -n "$SITE_PASSWORD" ]; then
            npx --yes staticrypt index.html -d . --short \
              --password "$SITE_PASSWORD" --remember 30 \
              --template-title "Sport-Radar" \
              --template-instructions "Bitte Passwort eingeben" \
              --template-button "Öffnen" \
              && echo "Seite verschlüsselt." \
              || echo "WARN: Verschlüsselung fehlgeschlagen - Seite bleibt offen."
          else
            echo "Kein SITE_PASSWORD gesetzt - Seite bleibt öffentlich."
          fi

      - name: Fehlerlog sichern
        if: failure()
        run: |
          git config user.name "sport-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/last_run.log || true
          git commit -m "FEHLGESCHLAGENER Lauf - Log" || true
          git pull --rebase origin main || true
          git push || true

      - name: Zu Cloudflare Pages veröffentlichen (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Kein CF_API_TOKEN gesetzt - Cloudflare-Deploy übersprungen." > data/cf_deploy.log
            exit 0
          fi
          {
            ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               https://api.cloudflare.com/client/v4/accounts               | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('result') or [{}])[0].get('id',''))")
            if [ -z "$ACC" ]; then echo "FEHLER: Konto nicht ermittelbar (Token-Rechte pruefen)"; exit 0; fi
            echo "Konto gefunden: ${ACC:0:6}..."
            export CLOUDFLARE_ACCOUNT_ID="$ACC"
            mkdir -p dist
            cp index.html dist/
            cp robots.txt dist/ 2>/dev/null || true
            npx --yes wrangler pages project create blsports-sport-radar               --production-branch main 2>&1 | head -2 || true
            npx --yes wrangler pages deploy dist --project-name blsports-sport-radar               --branch main --commit-dirty=true 2>&1 | tail -4
          } > data/cf_deploy.log 2>&1 || true
          cat data/cf_deploy.log

      - name: Änderungen committen
        run: |
          git config user.name "sport-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json data/last_run.log data/predictions_log.json data/odds_cache.json data/cf_deploy.log index.html 2>/dev/null || git add data/data.json data/last_run.log data/predictions_log.json index.html
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Tägliches Update $(date -u +%F)"
            git push
          fi

