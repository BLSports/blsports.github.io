name: Live-Ticker

on:
  schedule:
    # alle 15 Minuten zwischen 11:00 und 23:45 UTC (13:00-01:45 deutscher Zeit)
    - cron: "*/15 11-23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-ticker
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Live-Daten holen
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/live_update.py
      - name: live.json committen
        run: |
          git config user.name "sport-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then
            echo "Keine Änderung."
          else
            git commit -m "Live-Update"
            git pull --rebase origin main || true
            git push || true
          fi
